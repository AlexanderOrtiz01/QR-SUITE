version: 2

updates:
  # Dependencias de npm. Antes de producción es cuando sale más barato absorber
  # una versión mayor, así que se revisan cada semana y no una vez al año.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    target-branch: dev
    commit-message:
      prefix: 'deps'
    # Vite queda fijado en la 6 a propósito: la 7 y la 8 exigen Node ^20.19 o
    # >=22.12, y el entorno de desarrollo corre sobre Node 20.18. La 8 además
    # rompe los peers de @vitejs/plugin-react y @tailwindcss/vite, así que no
    # es un salto de dependencia sino una migración. Se desbloquea el día que
    # el proyecto suba a Node 22 LTS.
    ignore:
      - dependency-name: vite
        update-types: [version-update:semver-major]
      # Sus versiones mayores piden un Vite más nuevo (la 6 no instala sobre
      # Vite 6), así que se mueve junto con Vite, no por su cuenta.
      - dependency-name: '@vitejs/plugin-react'
        update-types: [version-update:semver-major]

    # Dependabot mete cada dependencia en el PRIMER grupo que la acepta, así
    # que los grupos que obligan a viajar juntos van antes que dev-tooling: si
    # no, @types/react* (que son de desarrollo) se irían a dev-tooling.
    groups:
      # react y react-dom tienen que viajar en la misma versión: si una sube
      # sin la otra, React aborta el arranque y la pantalla queda en blanco.
      react:
        patterns:
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'
      # eslint y @eslint/js también van en pareja: por separado, npm ci falla
      # por dependencias cruzadas.
      eslint:
        patterns:
          - eslint
          - '@eslint/js'
      # Un solo PR para las herramientas de desarrollo; las de producción
      # (recharts, qr-code-styling) se revisan una por una.
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]

  # Las propias actions del workflow también envejecen.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # Igual que npm: todo entra por dev y llega a main con el siguiente PR.
    target-branch: dev
    commit-message:
      prefix: 'ci'
