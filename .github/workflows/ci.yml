name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Un push nuevo sobre la misma rama cancela la ejecución anterior: no tiene
# sentido gastar minutos validando un commit que ya quedó atrás.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# El workflow solo lee el repositorio; nada de escribir.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20.x'
          cache: 'npm'

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
